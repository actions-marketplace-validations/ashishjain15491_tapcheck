name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', latest] # the engines minimum in package.json, and the current release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      # The part of scripts/check-public.sh that needs nothing local (its private-names list is never committed;
      # the secrets workflow runs gitleaks).
      - name: Every .md filename is in capitals
        run: |
          if git ls-files '*.md' | grep -vE '(^|/)[A-Z0-9_-]+\.md$'; then
            echo "::error::The .md filenames above must be in capitals"
            exit 1
          fi
